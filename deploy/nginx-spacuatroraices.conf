# nginx del host para Cuatro Raíces — DOMINIOS NUEVOS
#
#   spacuatroraices.com.ar        → web pública (PRINCIPAL, la que indexa Google)
#   www.spacuatroraices.com.ar    → 301 al principal
#   spacuatroraices.com (+ www)   → 301 al principal
#   crm.spacuatroraices.com.ar    → CRM (Django/gunicorn en 127.0.0.1:8003)
#
# Es un archivo APARTE del de spacuatroestaciones a propósito: sobre un server que ya anda,
# certbot reescribió el archivo viejo con sus bloques 443. Este se copia nuevo, se corre certbot
# para estos nombres y certbot le agrega su SSL, sin tocar lo que ya está funcionando.
#
#   sudo cp deploy/nginx-spacuatroraices.conf /etc/nginx/sites-available/spacuatroraices
#   sudo ln -s /etc/nginx/sites-available/spacuatroraices /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d spacuatroraices.com.ar -d www.spacuatroraices.com.ar \
#        -d spacuatroraices.com -d www.spacuatroraices.com -d crm.spacuatroraices.com.ar
#
# Paso a paso completo (DNS, orden, webhooks) en docs/mudanza-dominio.md.

# ──────────────  Variantes → dominio principal (301)  ──────────────
# Una sola URL canónica concentra la autoridad en Google. El .com y el www responden, pero
# redirigen: si respondieran 200 sería contenido duplicado en cuatro direcciones.
server {
    listen 80;
    server_name www.spacuatroraices.com.ar spacuatroraices.com www.spacuatroraices.com;
    return 301 https://spacuatroraices.com.ar$request_uri;
}

# ────────────────────────  WEB PÚBLICA (principal)  ────────────────────────
server {
    listen 80;
    server_name spacuatroraices.com.ar;

    # Carpeta web/ dentro del repo clonado. Si clonás en otra ruta, ajustá esto.
    root /opt/crmspa/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|webp|gif|svg|js|css|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

# ─────────────────────────────────  CRM  ─────────────────────────────────
# El único CRM. crm.spacuatroestaciones.com (archivo viejo) solo redirige acá. Los webhooks de
# Meta y Evolution tienen que apuntar a ESTE host: un webhook NO sigue redirects.
server {
    listen 80;
    server_name crm.spacuatroraices.com.ar;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
