# nginx del host para Estancia Cuatro Estaciones
# - spacuatroestaciones.com      → web pública ESTÁTICA (la carpeta web/)
# - crm.spacuatroestaciones.com  → CRM (Django/gunicorn dockerizado en 127.0.0.1:8003)
#
# Copiar a /etc/nginx/sites-available/spacuatroestaciones y linkear a sites-enabled/.
# Después correr certbot (ver docs/deploy.md) para el SSL — certbot completa solo los bloques 443.
#
# ⚠️  OJO si el servidor YA está andando: certbot reescribió el archivo de /etc/nginx con los
#     bloques 443 y los certificados. Copiar este archivo encima BORRA esa configuración y te
#     deja el sitio sin SSL. Sobre un server ya montado, editá el archivo de /etc/nginx a mano.

# ───────────────  www → sin www (301)  ───────────────
# Sin esto, la misma web responde 200 en las dos direcciones y queda contenido duplicado.
# El <link rel="canonical"> de cada página ya le dice a Google cuál es la buena, pero el 301
# lo resuelve de raíz y concentra toda la autoridad en un solo dominio.
server {
    listen 80;
    server_name www.spacuatroestaciones.com;
    return 301 https://spacuatroestaciones.com$request_uri;
}

# ─────────────────────────────  WEB PÚBLICA  ─────────────────────────────
server {
    listen 80;
    server_name spacuatroestaciones.com;

    # Carpeta web/ dentro del repo clonado. Si clonás en otra ruta, ajustá esto.
    root /opt/crmspa/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets (fotos, js, logo)
    location ~* \.(jpg|jpeg|png|webp|gif|svg|js|css|woff2?)$ {
        expires 7d;
        access_log off;
    }
}

# ────────────────────────────────  CRM  ─────────────────────────────────
server {
    listen 80;
    server_name crm.spacuatroestaciones.com;

    client_max_body_size 20M;  # subida de imágenes de circuitos, adjuntos de WhatsApp

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
